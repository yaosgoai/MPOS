<style>
:root{
  --bg:#f7efe3;--panel:#fffaf0;--main:#8a3f12;--main2:#5e2808;--accent:#d88a28;
  --danger:#b3261e;--ok:#237a3b;--border:#d8b98a;--text:#2a1a0a;--muted:#735c3f;
  --blue:#1f5e9e;--gray:#666;
}
*{box-sizing:border-box}
body{margin:0;font-family:"Microsoft JhengHei","Noto Sans TC",Arial,sans-serif;background:var(--bg);color:var(--text)}
header{background:linear-gradient(90deg,var(--main2),var(--main));color:white;padding:10px 16px;display:flex;justify-content:space-between;gap:12px;align-items:center}
.header-title{font-size:25px;font-weight:900}.header-sub{font-size:14px;line-height:1.45;opacity:.95}
.tabs{display:flex;gap:8px;padding:10px 14px;background:#ead5b5;border-bottom:2px solid var(--border);position:sticky;top:0;z-index:5}
.tab-btn{border:0;border-radius:12px;padding:12px 18px;background:#fff8e8;color:var(--main2);font-size:18px;font-weight:900;cursor:pointer;border:2px solid var(--border)}
.tab-btn.active{background:var(--main);color:white;border-color:var(--main)}
.tab-page{display:none}.tab-page.active{display:block}
.layout{display:grid;grid-template-columns:1.2fr .8fr;gap:14px;padding:14px;height:calc(100vh - 138px)}
.panel{background:var(--panel);border:2px solid var(--border);border-radius:16px;padding:14px;overflow:auto;box-shadow:0 4px 14px rgba(80,40,0,.12)}
.section-title{font-size:22px;font-weight:900;margin:0 0 12px;color:var(--main2);border-bottom:2px solid var(--border);padding-bottom:8px}
.category-title{font-size:20px;font-weight:900;color:var(--main);margin:10px 0}.category{margin-bottom:18px}
.menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}.item-btn{border:2px solid var(--border);background:#fff4dc;border-radius:14px;padding:16px 12px;cursor:pointer;text-align:left;min-height:105px;transition:.12s}.item-btn:hover{transform:translateY(-2px);border-color:var(--accent);background:#ffe6b8}.item-name{font-size:21px;font-weight:900;line-height:1.25}.item-price{margin-top:10px;font-size:25px;font-weight:900;color:var(--danger)}
.cart-empty{padding:28px;text-align:center;color:var(--muted);border:2px dashed var(--border);border-radius:12px}.cart-row{display:grid;grid-template-columns:1fr auto;gap:8px;padding:11px 0;border-bottom:1px solid var(--border)}.cart-name{font-size:19px;font-weight:900}.cart-meta{margin-top:5px;color:var(--muted);font-size:14px}.subtotal{margin-top:6px;font-size:18px;font-weight:900;color:var(--danger)}.qty-box{display:flex;align-items:center;gap:6px}.qty-btn{width:38px;height:38px;border:0;border-radius:10px;background:var(--main);color:white;font-size:22px;font-weight:900;cursor:pointer}.qty-btn.minus{background:#666}.qty-num{width:42px;text-align:center;font-size:22px;font-weight:900}
.total-box{margin-top:14px;padding:15px;border-radius:14px;background:#fff0c8;border:2px solid var(--accent);display:flex;justify-content:space-between;align-items:center}.total-label{font-size:24px;font-weight:900}.total-value{font-size:34px;font-weight:900;color:var(--danger)}
.note-grid{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}.note-chip{border:2px solid var(--border);background:#fff8e8;border-radius:999px;padding:9px 13px;font-size:16px;font-weight:900;cursor:pointer}.note-chip.active{background:var(--accent);color:white;border-color:var(--accent)}
input,select,textarea{width:100%;border-radius:10px;border:2px solid var(--border);padding:9px;font-size:16px;font-family:inherit;background:white}textarea{min-height:60px;resize:vertical}.hint{font-size:13px;color:var(--muted);line-height:1.5;margin-top:6px}.field-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.field-grid-4{display:grid;grid-template-columns:1.5fr 1.5fr 1fr .8fr;gap:8px;align-items:end}label{display:block;font-size:13px;font-weight:900;color:var(--main2);margin-bottom:4px}
.action-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}.main-btn{border:0;border-radius:12px;padding:14px;font-size:18px;font-weight:900;cursor:pointer}.print-btn{background:var(--ok);color:white}.clear-btn{background:var(--danger);color:white}.preview-btn{background:var(--main);color:white}.test-btn{background:#555;color:white}.blue-btn{background:var(--blue);color:white}.gray-btn{background:var(--gray);color:white}.small-btn{padding:8px 10px;font-size:14px;border-radius:8px;border:0;font-weight:900;cursor:pointer;margin:2px}.ok-btn{background:var(--ok);color:white}.danger-btn{background:var(--danger);color:white}
.message{margin-top:12px;padding:10px;border-radius:10px;display:none;white-space:pre-wrap;font-size:14px}.message.ok{display:block;background:#e7f6ec;color:#155f2c;border:1px solid #8bd19f}.message.err{display:block;background:#fdebea;color:#8a1c16;border:1px solid #f2a19a}.receipt-preview{display:none;margin-top:12px;background:#111;color:#f5f5f5;border-radius:10px;padding:12px;font-family:Consolas,"Courier New",monospace;white-space:pre-wrap;font-size:14px;max-height:250px;overflow:auto}
.admin-layout{padding:14px;display:grid;grid-template-columns:1fr;gap:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.stat-card{background:#fff0c8;border:2px solid var(--accent);border-radius:14px;padding:12px}.stat-title{font-size:14px;color:var(--muted);font-weight:900}.stat-value{font-size:28px;font-weight:900;color:var(--danger)}
table{width:100%;border-collapse:collapse;background:white;border-radius:10px;overflow:hidden}th,td{border:1px solid #e6d0aa;padding:8px;text-align:left;vertical-align:top}th{background:#fff0c8;color:var(--main2)}.order-items-table{border-radius:8px;margin:0;background:#fff}.order-items-table th,.order-items-table td{padding:5px 6px;font-size:13px}.order-items-table th{background:#fff7df}.num-cell{text-align:right;white-space:nowrap}.badge{display:inline-block;border-radius:999px;padding:3px 8px;font-size:12px;font-weight:900}.pending{background:#fff0c8;color:#7c4a00}.completed{background:#e7f6ec;color:#155f2c}.cancelled{background:#fdebea;color:#8a1c16}.item-mini{font-size:13px;color:#333;margin:2px 0}.admin-subtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}.admin-subtab{border:2px solid var(--border);background:#fff8e8;color:var(--main2);border-radius:10px;padding:9px 12px;font-size:15px;font-weight:900;cursor:pointer}.admin-subtab.active{background:var(--main);color:white;border-color:var(--main)}.admin-section{display:none}.admin-section.active{display:block}
.checkout-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9999;align-items:center;justify-content:center;padding:14px}.checkout-overlay.show{display:flex}.checkout-modal{width:min(520px,100%);background:var(--panel);border:3px solid var(--accent);border-radius:18px;padding:16px;box-shadow:0 12px 36px rgba(0,0,0,.35)}.checkout-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.checkout-title{font-size:24px;font-weight:900;color:var(--main2)}.checkout-close{border:0;background:var(--danger);color:white;border-radius:10px;padding:8px 12px;font-weight:900;cursor:pointer}.checkout-screen{background:#fff0c8;border:2px solid var(--accent);border-radius:14px;padding:12px;margin-bottom:12px}.checkout-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;font-size:20px;font-weight:900}.checkout-row.big{font-size:28px;color:var(--danger)}.checkout-input{font-size:34px;font-weight:900;text-align:right;background:white;border:2px solid var(--border);border-radius:12px;padding:10px;margin:8px 0}.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.key-btn{border:0;border-radius:12px;padding:16px;font-size:24px;font-weight:900;cursor:pointer;background:#fff4dc;border:2px solid var(--border);color:var(--text)}.key-btn.fn{background:#ddd}.key-btn.calc{background:var(--blue);color:white;border-color:var(--blue)}.key-btn.confirm{background:var(--ok);color:white;border-color:var(--ok);grid-column:span 3}.key-btn.no-print{background:#666;color:white;border-color:#666;grid-column:span 3}.key-btn.confirm:disabled,.key-btn.no-print:disabled{opacity:.45;cursor:not-allowed}.checkout-msg{min-height:24px;margin:8px 0;font-weight:900;color:var(--danger)}.quick-cash{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}.quick-cash .key-btn{font-size:18px;padding:10px}
.layout-editor-table input,.layout-editor-table select{font-size:13px;padding:5px;border-radius:7px}.layout-editor-table th,.layout-editor-table td{font-size:13px;padding:6px}.layout-preview-box{background:white;border:2px solid var(--border);border-radius:12px;padding:10px;margin-top:12px;max-width:420px;overflow:hidden}.layout-preview-line{white-space:pre;line-height:1}
@media(max-width:900px){header{flex-direction:column;align-items:flex-start}.header-title{font-size:21px}.tabs{overflow:auto}.tab-btn{white-space:nowrap;font-size:16px}.layout{grid-template-columns:1fr;height:auto}.menu-grid{grid-template-columns:repeat(auto-fill,minmax(145px,1fr))}.field-grid,.field-grid-4,.stats{grid-template-columns:1fr}.item-name{font-size:18px}.item-price{font-size:22px}}
/* ===== MPOS Cloud 新增 ===== */
.bridge-chip{display:inline-block;margin-left:8px;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:900;background:#666;color:#fff;vertical-align:middle}
.bridge-chip.ok{background:var(--ok)}.bridge-chip.warn{background:var(--accent)}.bridge-chip.err{background:var(--danger)}
.pin-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:10000;align-items:center;justify-content:center;padding:14px}
.pin-overlay.show{display:flex}
.pin-modal{width:min(360px,100%);background:var(--panel);border:3px solid var(--accent);border-radius:18px;padding:16px}
.pin-input{font-size:30px;letter-spacing:10px;text-align:center;width:100%;padding:10px;border:2px solid var(--border);border-radius:12px}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#2a1a0a;color:#fff;padding:12px 18px;border-radius:12px;font-weight:900;z-index:20000;display:none;max-width:90vw;white-space:pre-wrap}
.toast.show{display:block}
.loading-mask{position:fixed;inset:0;background:rgba(247,239,227,.9);display:flex;align-items:center;justify-content:center;z-index:30000;font-size:22px;font-weight:900;color:var(--main2)}
.barcode-preview svg{max-width:100%;height:60px}
/* ===== 新增訂購視窗 ===== */
.pos-single{padding:14px;max-width:900px;margin:0 auto}
.pos-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:12px;border-bottom:2px solid var(--border);padding-bottom:10px}
.new-order-btn{background:var(--accent);color:#fff;font-size:22px;padding:14px 22px;box-shadow:0 4px 12px rgba(216,138,40,.35)}
.note-summary{display:none;margin-top:10px;padding:10px 12px;border-radius:12px;background:#fff0c8;border:2px dashed var(--accent);font-weight:900;color:var(--main2);white-space:pre-wrap}
.order-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:9000;align-items:center;justify-content:center;padding:10px}
.order-overlay.show{display:flex}
.order-modal{width:min(1200px,100%);height:min(94vh,100%);background:var(--panel);border:3px solid var(--accent);border-radius:18px;padding:14px;display:flex;flex-direction:column;box-shadow:0 12px 36px rgba(0,0,0,.35)}
.order-body{flex:1;min-height:0;display:grid;grid-template-columns:1.4fr 1fr;gap:14px}
.order-menu,.order-side{overflow:auto;min-height:0;padding-right:4px}
.order-foot{display:grid;grid-template-columns:1fr auto auto auto;gap:10px;align-items:center;margin-top:12px;border-top:2px solid var(--border);padding-top:12px}
.order-foot .main-btn{padding:14px 26px}
.picker-total{font-size:24px;font-weight:900;color:var(--danger)}
.item-btn{position:relative}
.qty-badge{position:absolute;top:8px;right:10px;min-width:30px;height:30px;padding:0 8px;border-radius:999px;background:var(--danger);color:#fff;font-size:18px;font-weight:900;line-height:30px;text-align:center}
@media(max-width:900px){.order-body{grid-template-columns:1fr;overflow:auto}.order-menu,.order-side{overflow:visible}.order-foot{grid-template-columns:1fr 1fr}.picker-total{grid-column:span 2}.pos-head{flex-direction:column;align-items:stretch}}
.item-btn.selected{border-color:var(--danger);background:#ffe3c2;box-shadow:0 0 0 3px rgba(179,38,30,.25)}
.picker-item{padding:12px;border:2px solid var(--border);border-radius:12px;background:#fff;margin-bottom:10px}
.picker-qty{justify-content:center;margin:6px 0}
.picker-qty .qty-btn{width:56px;height:56px;font-size:28px}.picker-qty .qty-num{font-size:30px;min-width:60px}
.line-note{color:var(--danger);font-weight:900;font-size:15px;margin:2px 0}
.cart-line{cursor:pointer;flex:1}.edit-hint{font-size:14px;color:var(--muted)}
.main-btn:disabled{opacity:.45;cursor:not-allowed}

/* =====================================================================
 * RWD：依螢幕寬度 / 高度自動調整（手機直式、平板直/橫式、電腦）
 * 字級用 clamp() 隨螢幕寬度縮放，按鈕保持可點但不過大
 * ===================================================================== */
:root{
  --fs-xs:clamp(11px,1.4vw,13px);
  --fs-sm:clamp(13px,1.7vw,15px);
  --fs-md:clamp(14px,2vw,17px);
  --fs-lg:clamp(16px,2.4vw,20px);
  --fs-xl:clamp(18px,3vw,24px);
  --fs-2xl:clamp(22px,4vw,32px);
  --gap:clamp(8px,1.5vw,14px);
  --btn-pad:clamp(10px,1.6vw,14px);
  --radius:clamp(10px,1.4vw,14px);
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{font-size:var(--fs-md)}
header{padding:clamp(8px,1.5vw,12px) clamp(10px,2vw,16px)}
.header-title{font-size:var(--fs-xl);line-height:1.25}
.header-sub{font-size:var(--fs-xs)}
.bridge-chip{font-size:var(--fs-xs);padding:2px 8px}
.tabs{gap:6px;padding:8px clamp(8px,1.5vw,14px);overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab-btn{font-size:var(--fs-md);padding:8px clamp(10px,2vw,18px);white-space:nowrap;flex:0 0 auto;border-radius:var(--radius)}
.panel{padding:var(--gap);border-radius:var(--radius)}
.section-title{font-size:var(--fs-lg);margin-bottom:10px;padding-bottom:6px}
.category-title{font-size:var(--fs-md);margin:8px 0}
.menu-grid{grid-template-columns:repeat(auto-fill,minmax(clamp(120px,22vw,180px),1fr));gap:var(--gap)}
.item-btn{min-height:clamp(72px,11vw,100px);padding:clamp(10px,1.6vw,14px);border-radius:var(--radius)}
.item-name{font-size:var(--fs-lg)}
.item-price{font-size:var(--fs-lg)}
.cart-name{font-size:var(--fs-lg)}
.cart-meta{font-size:var(--fs-sm)}
.subtotal{font-size:var(--fs-md)}
.line-note{font-size:var(--fs-sm)}
.qty-btn{width:clamp(36px,5vw,44px);height:clamp(36px,5vw,44px);font-size:var(--fs-lg)}
.qty-num{font-size:var(--fs-lg);min-width:36px;text-align:center}
.total-box{padding:clamp(10px,1.6vw,15px)}
.total-label{font-size:var(--fs-lg)}
.total-value{font-size:var(--fs-2xl)}
.note-chip{font-size:var(--fs-sm);padding:7px 12px}
input,select,textarea{font-size:16px} /* 16px 以上避免手機自動放大 */
.main-btn{font-size:var(--fs-md);padding:var(--btn-pad);border-radius:var(--radius)}
.small-btn{font-size:var(--fs-sm)}
.action-row{gap:var(--gap)}
.new-order-btn{font-size:var(--fs-lg);padding:var(--btn-pad) clamp(14px,2.4vw,22px)}
.pos-single{padding:var(--gap)}
.admin-layout{padding:var(--gap);gap:var(--gap)}
.stat-value{font-size:var(--fs-xl)}
#ordersArea,#salesArea,#menuAdminArea,#noteAdminArea,#layoutEditorArea{overflow-x:auto;-webkit-overflow-scrolling:touch}
#ordersArea table{min-width:720px}

/* ---- 對話框：永遠不超出螢幕，內容可捲動 ---- */
.checkout-overlay,.order-overlay,.pin-overlay{padding:clamp(4px,1.5vw,14px)}
.checkout-modal,.order-modal,.pin-modal{max-height:calc(100vh - 8px);max-height:calc(100dvh - 8px);overflow:auto;padding:clamp(10px,2vw,16px);border-radius:var(--radius)}
.order-modal{height:calc(100dvh - 8px)}
.checkout-head{margin-bottom:8px}
.checkout-title{font-size:var(--fs-xl)}
.checkout-close{font-size:var(--fs-sm);padding:8px 14px}
.checkout-screen{padding:clamp(8px,1.5vw,12px);margin-bottom:var(--gap)}
.checkout-row{font-size:var(--fs-md);padding:3px 0}
.checkout-row.big{font-size:var(--fs-xl)}
.checkout-input{font-size:var(--fs-2xl);padding:clamp(4px,1vw,10px) 10px;margin:6px 0}
.quick-cash{grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-bottom:var(--gap)}
.quick-cash .key-btn{font-size:var(--fs-md);padding:clamp(8px,1.4vw,12px) 4px;white-space:nowrap}
.keypad{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.key-btn{font-size:var(--fs-xl);padding:clamp(8px,1.6vw,14px) 4px;border-radius:var(--radius);white-space:nowrap}
.key-btn.fn,.key-btn.calc{font-size:var(--fs-md)}
.key-btn.span2{grid-column:span 2}
.checkout-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
.checkout-actions .key-btn{font-size:var(--fs-md);padding:clamp(10px,1.8vw,16px) 4px;grid-column:auto;white-space:normal}
.checkout-msg{font-size:var(--fs-sm);min-height:0}
.order-foot .main-btn{font-size:var(--fs-md);padding:var(--btn-pad) clamp(12px,2vw,24px)}
.picker-total{font-size:var(--fs-xl)}
.picker-qty .qty-btn{width:clamp(44px,7vw,56px);height:clamp(44px,7vw,56px);font-size:var(--fs-xl)}
.picker-qty .qty-num{font-size:var(--fs-2xl)}
.pin-input{font-size:var(--fs-2xl)}

/* ---- 手機直式（≤ 600px） ---- */
@media (max-width:600px){
  header{flex-direction:column;align-items:flex-start;gap:4px}
  header > div:first-child .header-sub{display:none}        /* 隱藏「點餐 → … → 完成」 */
  header > .header-sub{font-size:11px;opacity:.85}
  .header-title span[style]{font-size:11px!important}
  .pos-head{flex-direction:row;align-items:center}
  .action-row{grid-template-columns:1fr 1fr}
  .field-grid,.field-grid-4,.stats{grid-template-columns:1fr 1fr}
  .stats .stat-card{padding:8px}
  .order-foot{grid-template-columns:1fr 1fr}
  .order-foot .picker-total{grid-column:span 2}
  .order-body{grid-template-columns:1fr}
}

/* ---- 平板直式 / 小平板（601 ~ 1024px） ---- */
@media (min-width:601px) and (max-width:1024px){
  .field-grid{grid-template-columns:repeat(2,1fr)}
  .stats{grid-template-columns:repeat(4,1fr)}
}

/* ---- 結帳：寬螢幕或橫式時左右兩欄（左：金額，右：鍵盤） ---- */
@media (min-width:700px){
  .checkout-modal{width:min(860px,100%)}
  .checkout-body{display:grid;grid-template-columns:1fr 1.1fr;gap:var(--gap);align-items:start}
}
/* ---- 矮螢幕（手機橫式、平板橫式）：再壓縮高度 ---- */
@media (max-height:600px){
  .key-btn{padding:6px 4px}
  .checkout-input{font-size:var(--fs-xl);padding:2px 10px}
  .checkout-row.big{font-size:var(--fs-lg)}
  header{padding:6px 12px}
  header > div:first-child .header-sub{display:none}
}

/* ---- 新增訂購視窗：窄螢幕改為上下排列，整個視窗捲動，下方按鈕固定 ---- */
@media (max-width:900px){
  .order-modal{overflow:auto;height:auto}
  .order-body{display:block;flex:none;overflow:visible}
  .order-menu,.order-side{overflow:visible;padding-right:0}
  .order-side{margin-top:var(--gap)}
  .order-foot{position:sticky;bottom:calc(-1 * clamp(10px,2vw,16px));background:var(--panel);margin-top:var(--gap);padding-bottom:4px;z-index:2}
}

/* ---- 條碼輸入按鈕（所有輸入欄位） ---- */
.scan-wrap{display:flex;align-items:stretch;gap:6px;width:100%}
.scan-wrap > input,.scan-wrap > textarea{flex:1;min-width:0}
.scan-btn{flex:0 0 auto;width:clamp(38px,5vw,46px);border:2px solid var(--border);border-radius:10px;background:#fff4dc;color:var(--main2);cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
.scan-btn:active{background:var(--accent);color:#fff}
.scan-wrap-ta .scan-btn{align-self:flex-start;height:clamp(38px,5vw,46px)}
.pin-modal .scan-wrap{display:block}

/* ---- 訂單來源 / 結帳按鈕 ---- */
