            p.then(function (hit) {
              // 內建沒讀到（或沒有內建）：ZXing 讀「穿過十字的水平帶」；有內建時每 2 張畫面才跑一次，避免耗電
              if (hit || !R || (eng.det && tick % 2)) return;
              var sh = Math.min(vw, vh) * 0.12, fr = [0.92, 0.78, 0.64, 0.5], scales = [1, 0.7];
              for (var k = 0; k < fr.length; k++) {
                for (var q = 0; q < scales.length; q++) {
                  var sw = vw * fr[k], sc = Math.min(2, Math.max(0.4, 1400 / sw)) * scales[q];
                  var bw = Math.round(sw * sc), bh = Math.max(40, Math.round(sh * sc));
                  c.width = bw; c.height = bh;
                  ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = 'high';
                  ctx.drawImage(v, (vw - sw) / 2, cy - sh / 2, sw, sh, 0, 0, bw, bh);
                  var t = zxTry(eng.Z, R.oneD, grayOf(ctx, bw, bh), bw, bh);
                  if (t) { candidate(t.format, t.text, 'zxing'); return; }
                }
              }
              if (!eng.det) {   // 沒有內建辨識：二維碼也用 ZXing 讀取景框正方形
                var s = Math.min(vw, vh) * 0.8, out = Math.min(800, Math.round(s));
                c.width = out; c.height = out;
                ctx.drawImage(v, cx - s / 2, cy - s / 2, s, s, 0, 0, out, out);
                var t2 = zxTry(eng.Z, R.twoD, grayOf(ctx, out, out), out, out);
                if (t2) candidate(t2.format, t2.text, 'zxing');
              }
            }).then(function () { busy = false; }, function () { busy = false; });
          }, 150);
        })
        .catch(function (e) {
          finish({ status: 'error', error: e && e.name === 'NotAllowedError' ? 'camera_permission' : 'camera_unavailable' });
        });
    });
  }

  /* ======================= 對外入口：scanLive（第 6、7 章） ======================= */
  function newId() {
    var a = new Uint8Array(16);
    (window.crypto || window.msCrypto).getRandomValues(a);
    return Array.prototype.map.call(a, function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
  }

  /**
   * 即時掃描。自動選擇：① App 原生（window.BarcodeBridge）② 本頁相機 ③ 掃描頁新視窗（opts.scanPageUrl）
   * opts = { formats, confirm, hint, voteWindowMs, mode: 'auto'|'native'|'inline'|'popup', scanPageUrl, popupFeatures }
   */
  function scanLive(opts) {
    opts = opts || {};
    var mode = opts.mode || 'auto';
    var id = newId();
    var bridge = typeof window !== 'undefined' ? window.BarcodeBridge : null;

    if ((mode === 'auto' || mode === 'native') && bridge && typeof bridge.postMessage === 'function') {
      return new Promise(function (resolve) {
        var prev = bridge.onmessage;
        bridge.onmessage = function (ev) {
          var d = null;
          try { d = JSON.parse(ev.data); } catch (e) { return; }
          if (!d || d.t !== 'barcode-result' || d.id !== id) return;
          bridge.onmessage = prev || null;
          if (d.status === 'ok' && !validate(d.format, d.text)) d = { status: 'error', error: 'invalid_result' };
          resolve({ status: d.status, text: d.text, format: d.format, engine: d.engine, error: d.error });
        };
        bridge.postMessage(JSON.stringify({ t: 'barcode-scan', v: 1, id: id, formats: opts.formats || [], confirm: opts.confirm !== false, hint: opts.hint }));
      });
    }
    if (mode === 'native') return Promise.resolve({ status: 'error', error: 'native_unavailable' });

    if ((mode === 'auto' || mode === 'inline') && cameraAllowed() && (mode === 'inline' || window.top === window)) return runScanner(opts);
    if (mode === 'inline') return Promise.resolve({ status: 'error', error: 'camera_unavailable' });

    if (!opts.scanPageUrl) return Promise.resolve({ status: 'error', error: 'no_scan_page' });
    return new Promise(function (resolve) {
      var pageOrigin = new URL(opts.scanPageUrl, location.href).origin;
      var q = new URLSearchParams({ id: id, origin: location.origin, confirm: opts.confirm === false ? '0' : '1' });
      if (opts.formats && opts.formats.length) q.set('formats', opts.formats.join(','));
      var w = window.open(opts.scanPageUrl + (opts.scanPageUrl.indexOf('?') >= 0 ? '&' : '?') + q.toString(), 'barcode_scan', opts.popupFeatures || 'width=480,height=720');
      if (!w) { resolve({ status: 'error', error: 'popup_blocked' }); return; }
      var closedTimer = null;
      function onMsg(e) {
        if (e.origin !== pageOrigin || e.source !== w) return;   // 只接受自己開的掃描頁
        var d = e.data;
        if (!d || d.t !== 'barcode-result' || d.id !== id) return;
        cleanup();
        if (d.status === 'ok' && !validate(d.format, d.text)) d = { status: 'error', error: 'invalid_result' };
        resolve({ status: d.status, text: d.text, format: d.format, engine: d.engine, error: d.error });
      }
      function cleanup() { window.removeEventListener('message', onMsg); clearInterval(closedTimer); }
      window.addEventListener('message', onMsg);
      closedTimer = setInterval(function () { if (w.closed) { cleanup(); resolve({ status: 'cancel' }); } }, 800);
    });
  }

  return {
    version: VERSION,
    FORMATS: FORMATS.slice(),
    LABELS: LABELS,
    config: config,
    normFormat: normFormat,
    validate: validate,
    requiredReads: requiredReads,
    createVoter: createVoter,
    decodeFile: decodeFile,
    runScanner: runScanner,
    scanLive: scanLive,
    cameraAllowed: cameraAllowed
  };
});

</script>
