// 條碼模組（Android Library）— 規格：《條碼模組規格書》第 8 章
// 引用方式（同一個 Gradle 專案）：settings.gradle 加
//   include ':barcode-scanner'
//   project(':barcode-scanner').projectDir = new File('<路徑>/條碼模組/android/barcode-scanner')
// app/build.gradle 加：implementation project(':barcode-scanner')
plugins {
    id 'com.android.library'
}

android {
    namespace 'tw.com.acepillar.barcode'
    compileSdk 34

    defaultConfig {
        minSdk 24
        targetSdk 34
        consumerProguardFiles 'consumer-rules.pro'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
    implementation 'androidx.activity:activity:1.9.2'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    implementation 'com.google.zxing:core:3.5.3'
    implementation 'androidx.webkit:webkit:1.8.0'   // 只有 WebViewScanBridge 使用

    testImplementation 'junit:junit:4.13.2'
}
