name: MPOS CI/CD

# push 到 main：測試 → 部署 GitHub Pages → 線上冒煙測試 → 編譯 APK → 模擬器自動化測試 → 發佈 Release
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      skip_emulator:
        description: '略過 Android 模擬器測試'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: mpos-cicd
  cancel-in-progress: false

jobs:
  web-test:
    name: GAS / 外殼自動化測試
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
        if: ${{ !contains(github.event.head_commit.message, '[fast]') }}
      - name: 單元測試 + 端對端測試（mock GAS）
        if: ${{ !contains(github.event.head_commit.message, '[fast]') }}
        run: npm test
      - name: 單元測試（快速部署）
        if: ${{ contains(github.event.head_commit.message, '[fast]') }}
        run: npm run test:unit

  pages:
    name: 部署 GitHub Pages
    needs: web-test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deploy
        uses: actions/deploy-pages@v4

  live-smoke:
    name: 線上冒煙測試（GAS + Pages）
    needs: pages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: 線上測試
        env:
          PAGES_URL: ${{ needs.pages.outputs.page_url }}
        run: npm run test:live

  android:
    name: 編譯 APK + 模擬器測試 + 發佈
    needs: [pages, live-smoke]
    runs-on: ubuntu-latest
    # 快速部署（commit 訊息含 [fast]）不重編 APK
    if: ${{ !contains(github.event.head_commit.message, '[fast]') }}
    env:
      SHELL_URL: ${{ needs.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: 版本資訊
        id: ver
        run: |
          echo "name=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_OUTPUT"
          echo "code=${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: 還原簽章金鑰
        env:
          KS_B64: ${{ secrets.MPOS_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mpos-release.jks"
            echo "MPOS_KEYSTORE_FILE=$RUNNER_TEMP/mpos-release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::未設定 MPOS_KEYSTORE_BASE64，APK 將使用 debug 簽章（每次編譯簽章不同，無法覆蓋安裝）"
          fi

      - name: 單元測試 + 編譯 Release APK
        working-directory: android
        env:
          MPOS_KEYSTORE_PASSWORD: ${{ secrets.MPOS_KEYSTORE_PASSWORD }}
          MPOS_KEY_ALIAS: ${{ secrets.MPOS_KEY_ALIAS }}
          MPOS_KEY_PASSWORD: ${{ secrets.MPOS_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest assembleRelease \
            -PshellUrl="$SHELL_URL" -PversionCode=${{ steps.ver.outputs.code }} -PversionName=${{ steps.ver.outputs.name }}
          mkdir -p ../dist
          cp app/build/outputs/apk/release/app-release.apk "../dist/MPOS-${{ steps.ver.outputs.name }}-b${{ steps.ver.outputs.code }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: mpos-apk
          path: dist/*.apk

      - name: 啟用 KVM
        if: ${{ !inputs.skip_emulator && !contains(github.event.head_commit.message, '[skip emulator]') }}
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 模擬器自動化測試
        if: ${{ !inputs.skip_emulator && !contains(github.event.head_commit.message, '[skip emulator]') }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: cd android && ./gradlew --no-daemon connectedDebugAndroidTest -PshellUrl="$SHELL_URL" -PversionCode=${{ steps.ver.outputs.code }} -PversionName=${{ steps.ver.outputs.name }}

      - name: 上傳測試報告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: |
            android/app/build/reports/
          if-no-files-found: ignore

      - name: 發佈 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: app-v${{ steps.ver.outputs.code }}
          name: MPOS App ${{ steps.ver.outputs.name }} (build ${{ steps.ver.outputs.code }})
          body: |
            外殼網址：${{ env.SHELL_URL }}
            Commit：${{ github.sha }}
          files: dist/*.apk
          make_latest: true
